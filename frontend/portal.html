<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Hostel Care Dashboard</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body class="portal-body">
        <div class="app-shell">
            <aside class="sidebar">
                <a class="side-brand" href="portal.html">
                    <span class="brand-mark small">HC</span>
                    <span><b>Hostel Care</b><small>Management portal</small></span>
                </a>
                <div class="profile-mini">
                    <div class="avatar" id="avatar">HC</div>
                    <div><b id="side-name">Loading...</b><small id="side-role">Portal</small></div>
                </div>
                <nav id="sidebar-nav" class="sidebar-nav"></nav>
                <button id="logout-btn" class="btn logout">↪ Log out</button>
            </aside>
            <main class="main-area">
                <header class="topbar">
                    <div>
                        <p class="eyebrow">HOSTEL OPERATIONS</p>
                        <h1 id="page-title">Dashboard</h1>
                    </div>
                    <div class="top-user">
                        <span class="status-dot"></span>
                        <span id="top-name">User</span>
                    </div>
                </header>
                <section id="page-content" class="page-content">
                    <div class="loading">Loading your dashboard…</div>
                </section>
                <footer class="page-footer">Hostel Care · Demo application · Protect student data</footer>
            </main>
        </div>
        <div id="toast" class="toast hidden"></div>
        <script src="js/portal.js"></script>
    </body>
    </html>
